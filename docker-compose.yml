version: "3.8"

services:
  postgres:
    container_name: medusa-backend-postgres
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: medusa_user
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: medusa_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa_user"]
      interval: 5s
      timeout: 5s
      retries: 10

  medusa:
    container_name: medusa-backend-medusa
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      NODE_ENV: development
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: yarn dev

volumes:
  pgdata:
