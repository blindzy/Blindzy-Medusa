version: "3.8"

services:
  postgres:
    container_name: medusa-backend-postgres
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: medusa_user
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: medusa_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa_user"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: medusa-backend-redis
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  medusa:
    container_name: medusa-backend-medusa
    build: 
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"
      - "7001:7001"  # Admin dashboard
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://medusa_user:admin123@postgres:5432/medusa_db
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev

volumes:
  pgdata:
